<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #10283d 0%, #050b12 45%, #020509 100%);
  color: #00d9ff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 700px;
  padding: 30px 20px;
  text-align: center;
}

h1 {
  font-size: 58px;
  letter-spacing: 12px;
  margin-bottom: 5px;
  text-shadow: 0 0 20px #00d9ff;
}

.subtitle {
  color: #7bdfff;
  margin-bottom: 40px;
}

.arc {
  width: 190px;
  height: 190px;
  margin: auto;
  border-radius: 50%;
  border: 3px solid #00d9ff;
  box-shadow:
    0 0 20px #00d9ff,
    inset 0 0 30px #00d9ff;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 2s infinite;
}

.arc span {
  font-size: 50px;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 20px #00d9ff,
                inset 0 0 30px #00d9ff;
  }

  50% {
    transform: scale(1.05);
    box-shadow: 0 0 45px #00d9ff,
                inset 0 0 50px #00d9ff;
  }
}

#status {
  margin-top: 35px;
  font-size: 18px;
  color: white;
}

#userText,
#jarvisText {
  margin: 18px auto;
  padding: 15px;
  max-width: 600px;
  border: 1px solid #075b76;
  border-radius: 12px;
  background: rgba(0, 20, 35, 0.7);
  color: white;
  min-height: 25px;
}

button {
  margin-top: 20px;
  padding: 15px 30px;
  border-radius: 30px;
  border: 2px solid #00d9ff;
  background: transparent;
  color: #00d9ff;
  font-size: 17px;
  font-weight: bold;
}

button:active {
  background: #00d9ff;
  color: #001018;
}
</style>
</head>

<body>

<div class="container">

  <h1>JARVIS</h1>

  <div class="subtitle">
    SISTEMA DE ASSISTÊNCIA PESSOAL
  </div>

  <div class="arc">
    <span>◉</span>
  </div>

  <div id="status">
    Sistema iniciando...
  </div>

  <div id="userText">
    Você: —
  </div>

  <div id="jarvisText">
    JARVIS: —
  </div>

  <button onclick="iniciarJarvis()">
    🎙️ ATIVAR JARVIS
  </button>

</div>

<script>

let reconhecimento;
let ativo = false;

const status = document.getElementById("status");
const userText = document.getElementById("userText");
const jarvisText = document.getElementById("jarvisText");

function falar(texto) {

  speechSynthesis.cancel();

  const voz = new SpeechSynthesisUtterance(texto);

  voz.lang = "pt-BR";
  voz.rate = 1;
  voz.pitch = 1;

  voz.onend = function() {

    if (ativo) {
      setTimeout(() => {
        iniciarEscuta();
      }, 300);
    }

  };

  speechSynthesis.speak(voz);
}

function responder(texto) {

  const comando = texto.toLowerCase();

  let resposta = "";

  if (
    comando.includes("olá") ||
    comando.includes("oi") ||
    comando.includes("bom dia") ||
    comando.includes("boa tarde") ||
    comando.includes("boa noite")
  ) {

    resposta = "Olá. Sistemas JARVIS online. Como posso ajudar?";

  }

  else if (comando.includes("seu nome")) {

    resposta = "Meu nome é JARVIS. Assistente pessoal de inteligência artificial.";

  }

  else if (comando.includes("quem é você")) {

    resposta = "Sou seu assistente pessoal. Minha função é ajudar você através de comandos de voz.";

  }

  else if (comando.includes("hora")) {

    const agora = new Date();

    resposta =
      "Agora são " +
      agora.getHours() +
      " horas e " +
      agora.getMinutes() +
      " minutos.";

  }

  else if (comando.includes("data")) {

    const agora = new Date();

    resposta =
      "Hoje é dia " +
      agora.getDate() +
      " do mês " +
      (agora.getMonth() + 1) +
      " de " +
      agora.getFullYear() +
      ".";

  }

  else if (comando.includes("desligar jarvis")) {

    ativo = false;

    resposta = "Desativando o sistema. Até logo.";

  }

  else if (comando.includes("parar de ouvir")) {

    ativo = false;

    resposta = "Reconhecimento de voz desativado.";

  }

  else {

    resposta =
      "Entendi você dizer: " +
      texto +
      ". Ainda estou aprendendo esse comando.";

  }

  jarvisText.innerText = "JARVIS: " + resposta;

  falar(resposta);
}

function iniciarEscuta() {

  if (!ativo) return;

  const Reconhecimento =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Reconhecimento) {

    status.innerText =
      "Seu navegador não suporta reconhecimento de voz.";

    return;
  }

  reconhecimento = new Reconhecimento();

  reconhecimento.lang = "pt-BR";

  reconhecimento.continuous = false;

  reconhecimento.interimResults = false;

  reconhecimento.onstart = function() {

    status.innerText =
      "🎙️ JARVIS está ouvindo...";

  };

  reconhecimento.onresult = function(event) {

    const texto =
      event.results[0][0].transcript;

    userText.innerText =
      "Você: " + texto;

    status.innerText =
      "Processando comando...";

    responder(texto);
  };

  reconhecimento.onerror = function() {

    if (ativo) {

      status.innerText =
        "Tentando ouvir novamente...";

      setTimeout(iniciarEscuta, 1000);
    }

  };

  reconhecimento.onend = function() {

    if (ativo && !speechSynthesis.speaking) {

      setTimeout(iniciarEscuta, 500);

    }

  };

  reconhecimento.start();
}

function iniciarJarvis() {

  ativo = true;

  status.innerText =
    "Sistema JARVIS ativado.";

  jarvisText.innerText =
    "JARVIS: Sistemas online.";

  falar(
    "Sistemas JARVIS online. Estou ouvindo."
  );
}

</script>

</body>
</html>
